name: Android release build (AAB)

# Builds the Börü Care Android wrapper (a Trusted Web Activity around the
# hosted Next.js app) into a signed .aab ready for Play Console upload.
# Runs on GitHub's own runners because they have unrestricted internet
# access to Google's Android SDK / Maven servers, which some development
# environments (including the one that authored this project) cannot reach.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        working-directory: android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build signed release AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: boru-care-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
